services:
  - type: web
    name: propertyops
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # secrets are entered in the Render dashboard, never stored in this file
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: MURF_API_KEY
        sync: false
      - key: AGORA_CHANNEL
        value: propertyops-demo
      - key: PO_SIM_HOUR
        value: "23"
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: MURF_VOICE_ID
        value: Abhinav
      - key: MURF_LOCALE
        value: en-IN
